[project]
name = "rein"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.16.0",
    "pydantic>=2.13.4",
    "ruff>=0.15.22",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["core", "adapters", "tools"]
